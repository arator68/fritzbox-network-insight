name: Internal topology tests

on:
  push:
    branches:
      - feature/avm-mesh-topology
  pull_request:
    paths:
      - 'custom_components/fritzbox_network_insight/topology/**'
      - 'tests/test_internal_graph.py'
      - '.github/workflows/internal-topology-tests.yml'

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile internal topology modules
        run: python -m compileall -q custom_components/fritzbox_network_insight/topology
      - name: Run internal topology regression tests
        run: python -m unittest discover -s tests -p 'test_internal_graph.py' -v
